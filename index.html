<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Tecsycom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23FF5A0A%27/%3E%3Cpath d=%27M12 38c11-15 29-15 40 0%27 stroke=%27white%27 stroke-width=%275%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M20 46c7-9 17-9 24 0%27 stroke=%27white%27 stroke-width=%275%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2732%27 cy=%2753%27 r=%274.5%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #fff3ed; /* Color claro adaptado al tono #FF5A0A */
    --line: #ffd1bd;
    --text: #1a202c;
    --text-dim: #705448;
    --accent: #FF5A0A; /* Color solicitado */
    --shadow: 0 1px 3px rgba(255, 90, 10, 0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; flex-direction:column; height:100vh;}

  /* --- BARRA SUPERIOR: NEGRO BRILLANTE TIPO ESPEJO --- */
  nav.tabbar{
    display:flex; align-items:center; gap:6px;
    background: linear-gradient(135deg, rgba(20, 20, 20, 0.92) 0%, rgba(5, 5, 5, 0.95) 100%); /* Negro brillante degradado */
    backdrop-filter: blur(14px) saturate(180%); /* Efecto espejo/cristal */
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15); /* Brillo sutil en el borde inferior */
    padding:12px 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1); /* Reflejo superior e inferior */
    flex-wrap:wrap;
    z-index:5;
  }
  nav.tabbar .brand{
    font-weight:700; font-size:15px; margin-right:18px;
    color: #ffffff; white-space:nowrap;
  }
  nav.tabbar .brand span{
    display:block; font-weight:500; font-size:11.5px; color: #a0aec0;
  }
  
  /* Botones originales restaurados */
  .tab-btn{
    font-family:inherit; font-size:13px; font-weight:600;
    color:var(--text-dim); background:var(--panel-2);
    border:1px solid #ffdec2; border-radius:6px;
    padding:9px 16px; cursor:pointer; transition:all .15s ease;
    white-space:nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn svg {
    flex-shrink: 0;
  }
  .tab-btn:hover{ color:#c23f00; background:#ffe3d5; }
  .tab-btn.active{
    background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:var(--shadow);
  }
  .tab-btn.active svg path,
  .tab-btn.active svg circle {
    stroke: #ffffff;
    fill: none;
  }
  .tab-btn.active svg circle[fill] {
    fill: #ffffff;
  }

  .sync-status{ margin-left:auto; font-size:12px; color: #a0aec0; max-width:520px; }
  .sync-status.ok{ color: #ff8a50; font-weight:600; }
  .sync-status.warn{ color:#fbbf24; }

  .frames{ position:relative; flex:1; min-height:0; }
  .frames iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:none;
    background:var(--bg);
    display:none;
  }
  .frames iframe.active{ display:block; }

  @media (max-width:700px){
    nav.tabbar{ padding:10px 12px; gap:5px; }
    nav.tabbar .brand{ width:100%; margin-right:0; margin-bottom:6px; }
    .tab-btn{ padding:8px 12px; font-size:12.5px; }
    .sync-status{ margin-left:0; width:100%; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="tabbar">
    <div class="brand">Peru Fibra <span>Panel operativo · Tecsycom</span></div>
    <button class="tab-btn active" data-target="frame-dilacion">Dilación</button>
    <button class="tab-btn" data-target="frame-distrito">Distrito</button>
    <button class="tab-btn" data-target="frame-evolutivo">Evolutivo</button>
    <button class="tab-btn" data-target="frame-efectividad">Reporte de Cierre</button>
    <button class="tab-btn" data-target="frame-adicionales">Reporte por Hora</button>
    <button class="tab-btn" data-target="frame-bonoextra">Bono Extra</button>
    <button class="tab-btn" data-target="frame-altasaverias">Reporte Altas vs Averias</button>
    <button class="tab-btn" data-target="frame-cargaseriado">Carga de Seriado</button>
    <button class="tab-btn" data-target="frame-producdiaria">Produc-Diaria</button>
    <button class="tab-btn" data-target="frame-garantias">Garantías</button>
    <button class="tab-btn" data-target="frame-descansoprog">Descanso-Prog</button>
    <button class="tab-btn" data-target="frame-mesh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/>
        <path d="M2 8.82a15 15 0 0 1 20 0"/>
        <path d="M5 12.85a10 10 0 0 1 14 0"/>
        <path d="M8.5 16.88a5 5 0 0 1 7 0"/>
      </svg>
      Mesh
    </button>
    <button class="tab-btn" data-target="frame-win">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.48"/>
        <path d="M7.76 16.24a6 6 0 0 1 0-8.48"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        <path d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
      </svg>
      WIN
    </button>
    <!-- Botón PF vs WIN Agregado -->
    <button class="tab-btn" data-target="frame-pwin">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10"/>
        <path d="M12 20V4"/>
        <path d="M6 20v-6"/>
      </svg>
      PF vs WIN
    </button>
    <div class="sync-status" id="syncStatus"></div>
  </nav>

  <div class="frames">
    <iframe id="frame-dilacion" class="active" src="dilacion.html"></iframe>
    <iframe id="frame-distrito" src="distrito.html"></iframe>
    <iframe id="frame-evolutivo" src="evolutivo.html"></iframe>
    <iframe id="frame-efectividad" src="efectividad.html"></iframe>
    <iframe id="frame-adicionales" src="reporte_adicionales.html"></iframe>
    <iframe id="frame-bonoextra" src="bonoextra.html" data-nosync></iframe>
    <iframe id="frame-altasaverias" src="Reporte_Altas_vs_Averias.html" data-nosync></iframe>
    <iframe id="frame-cargaseriado" src="carga-seriados.html" data-nosync></iframe>
    <iframe id="frame-producdiaria" src="produccion-diario.html" data-nosync></iframe>
    <iframe id="frame-garantias" src="garantias.html" data-nosync></iframe>
    <iframe id="frame-descansoprog" src="descanso_programado.html" data-nosync></iframe>
    <iframe id="frame-mesh" src="quantum_mesh_validator.html" data-nosync></iframe>
    <iframe id="frame-win" src="centro-operativo.html" data-nosync></iframe>
    <!-- Frame PF vs WIN Agregado -->
    <iframe id="frame-pwin" src="reporte_pwin.html" data-nosync></iframe>
  </div>
</div>

<script>
  const buttons = document.querySelectorAll('.tab-btn');
  const frames = document.querySelectorAll('.frames iframe');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.target;
      buttons.forEach(b => b.classList.toggle('active', b === btn));
      frames.forEach(f => f.classList.toggle('active', f.id === targetId));
      const activo = document.getElementById(targetId);
      if (activo && activo.contentWindow) activo.contentWindow.postMessage({ type: 'pf-mostrar' }, '*');
    });
  });

  const etiquetas = {};
  buttons.forEach(b => { etiquetas[b.dataset.target] = b.textContent.trim(); });
  const syncStatus = document.getElementById('syncStatus');
  let sync = null;

  function frameDe(source){ return [...frames].find(f => f.contentWindow === source); }

  function pintarEstado(){
    if (!sync) return;
    const ok = [...sync.recibieron].map(id => etiquetas[id]);
    const falta = [...sync.esperados].filter(id => !sync.recibieron.has(id)).map(id => etiquetas[id]);
    let txt = sync.nombre + ' · cargado en ' + etiquetas[sync.origen];
    if (ok.length) txt += ' y también en: ' + ok.join(', ');
    if (falta.length && sync.vencido) txt += ' · sin respuesta: ' + falta.join(', ') + ' (revisa que esa web tenga la versión nueva)';
    syncStatus.textContent = txt;
    syncStatus.className = 'sync-status ' + (falta.length && sync.vencido ? 'warn' : 'ok');
  }

  window.addEventListener('message', e => {
    const origen = frameDe(e.source);
    if (!origen || !e.data || origen.hasAttribute('data-nosync')) return;

    if (e.data.type === 'pf-archivo-cargado' && e.data.file){
      const otros = [...frames].filter(f => f !== origen && !f.hasAttribute('data-nosync'));
      sync = { nombre: e.data.file.name, origen: origen.id, esperados: new Set(otros.map(f => f.id)), recibieron: new Set(), vencido: false };
      otros.forEach(f => f.contentWindow.postMessage({ type: 'pf-cargar-archivo', file: e.data.file }, '*'));
      pintarEstado();
      setTimeout(() => { if (sync) { sync.vencido = true; pintarEstado(); } }, 2500);
    } else if (e.data.type === 'pf-ack' && sync && sync.esperados.has(origen.id)){
      sync.recibieron.add(origen.id);
      pintarEstado();
    }
  });
</script>

</body>
</html>
